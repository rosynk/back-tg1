# 1. IDENTIFICACAO E SERVIDOR
spring.application.name=Bizi
server.port=8086

# 2. CONFIGURACAO DO BANCO DE DADOS
spring.datasource.url=jdbc:mysql://localhost:3306/banco_oficial?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. HIBERNATE JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 4. SWAGGER SPRINGDOC
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=1

# 5. SEGURANCA E CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*

# 6. LOGS DE DIAGNOSTICO
logging.level.org.springframework.security=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-de-app-do-google
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Exibe todo o passo a passo da segurança no console
logging.level.org.springframework.security=DEBUG

# Exibe o processamento dos filtros (ajuda a ver se o seu JwtFilter foi chamado)
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Exibe detalhes de como o Spring está tentando autenticar o usuário
logging.level.org.springframework.security.authentication.dao.DaoAuthenticationProvider=DEBUG

# Mostra o SQL limpo no console
spring.jpa.show-sql=true

# Formata o SQL para ficar legível
spring.jpa.properties.hibernate.format_sql=true

# Mostra os valores reais que substituem o "?" no SQL
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# 1. Ver o passo a passo da segurança (Fundamental para ver o 403)
logging.level.org.springframework.security=DEBUG

# 2. Ver se o seu JwtFilter está sendo chamado e se ele encontra o usuário
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# 3. Ver detalhes do CORS (Se ele está bloqueando o preflight OPTIONS)
logging.level.org.web.servlet.handler.AbstractHandlerMapping=DEBUG
logging.level.org.springframework.web.cors=DEBUG