# 1. IDENTIFICACAO E SERVIDOR
spring.application.name=Bizi
server.port=8086

# 2. CONFIGURACAO DO BANCO DE DADOS
spring.datasource.url=jdbc:mysql://localhost:3306/bizi_novo_teste?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Beatriz1205****
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. HIBERNATE E JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#spring.jpa.hibernate.ddl-auto=create

# 4. SWAGGER E API DOCS
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=1

# 5. SEGURANCA E CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# 6. CONFIGURACAO DE EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 7. ARMAZENAMENTO
bizi.storage.raiz=C:/Users/IBM/Desktop/UpdateTg2Bizi/DocumentosOnboarding

# 8. LOGS
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE